
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://student-management-backend.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview]
  [context.deploy-preview.environment]
    VITE_API_URL = "https://student-management-backend.onrender.com"

[context.branch-deploy]
  [context.branch-deploy.environment]
    VITE_API_URL = "https://student-management-backend.onrender.com"
