services:
  - type: web
    name: student-management-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://student-management-frontend.netlify.app
    healthCheckPath: /health
    domains:
      - student-management-backend.onrender.com