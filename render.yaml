
services:
  - type: web
    name: student-management-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://student-management-frontend.netlify.app
    healthCheckPath: /health

  - type: static
    name: student-management-frontend
    buildCommand: cd client && npm install && npm run build
    publishPath: client/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://student-management-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
